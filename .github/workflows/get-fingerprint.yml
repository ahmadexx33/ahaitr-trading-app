name: Generate Debug Keystore and Fingerprint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate debug keystore (only if it doesn't already exist)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists — reusing it, not regenerating."
          fi

      - name: Print SHA256 fingerprint
        run: keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Commit keystore to repo (only first run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug.keystore
          git diff --cached --quiet || git commit -m "Add debug keystore for consistent signing"
          git push
